name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Unit tests (Mockito, no external services)
        run: mvn -B test -Dtest='!*IntegrationTest'

      - name: Integration tests (Testcontainers, needs Docker)
        run: mvn -B test -Dtest='*IntegrationTest'

      - name: Package
        run: mvn -B clean package -DskipTests

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ledgerline-jar
          path: target/ledgerline-*.jar

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ledgerline:ci .

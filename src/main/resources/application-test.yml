spring:
  datasource:
    url: jdbc:h2:mem:ledgerline;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false   # unit tests use @DataJpaTest schema-per-entity instead;
                      # Flyway/Postgres-specific migrations are exercised by
                      # the (Testcontainers) integration tests only.
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
